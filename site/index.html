<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Northeastern Dining</title>
    <meta
      name="description"
      content="Where to eat at and around Northeastern: hours, meal swipes, and Dining Dollars."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23c8102e'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'>N</text></svg>"
    />
    <script>
      // Apply a saved theme before the page paints, so it doesn't flash.
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
      integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./">Northeastern Dining</a>
      <div class="header-tools">
        <nav aria-label="Main navigation">
          <a href="data/dining_locations.json">Raw JSON</a>
        </nav>
        <form class="settings" id="settings">
          <label class="switch" title="12- or 24-hour clock">
            <span class="clock-12" aria-hidden="true">12h</span>
            <input type="checkbox" name="clock" role="switch" aria-label="24-hour clock" />
            <span class="clock-24" aria-hidden="true">24h</span>
          </label>
          <fieldset class="segmented">
            <legend class="visually-hidden">Color theme</legend>
            <label title="Light">
              <input type="radio" name="theme" value="light" aria-label="Light" />
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
              </svg>
            </label>
            <label title="Auto (match system)">
              <input type="radio" name="theme" value="auto" aria-label="Auto" />
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" />
              </svg>
            </label>
            <label title="Dark">
              <input type="radio" name="theme" value="dark" aria-label="Dark" />
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
              </svg>
            </label>
          </fieldset>
        </form>
      </div>
    </header>

    <main class="page">
      <section class="intro" id="intro">
        <h1>Where to eat</h1>
        <p id="sources">Loading dining data…</p>
        <noscript><p>This site needs JavaScript to filter and show locations.</p></noscript>
      </section>

      <form class="filters" id="filters" hidden>
        <fieldset class="filter-group">
          <legend class="filter-label">Type</legend>
          <label class="pill"><input type="radio" name="category" value="" />All</label>
          <label class="pill"><input type="radio" name="category" value="restaurants" />Restaurants &amp; cafés</label>
          <label class="pill"><input type="radio" name="category" value="markets" />Markets</label>
        </fieldset>

        <fieldset class="filter-group">
          <legend class="filter-label">Pay with</legend>
          <label class="pill"><input type="radio" name="payment" value="" />Anything</label>
          <label class="pill"><input type="radio" name="payment" value="meal_swipes" />Meal swipes</label>
          <label class="pill"><input type="radio" name="payment" value="dining_dollars" />Dining Dollars</label>
        </fieldset>

        <fieldset class="filter-group">
          <legend class="filter-label">Hours</legend>
          <label class="pill"><input type="radio" name="when" value="any" />Any time</label>
          <label class="pill"><input type="radio" name="when" value="now" />Open now</label>
          <label class="pill"><input type="radio" name="when" value="at" />Open at…</label>
          <input
            class="time-input"
            type="datetime-local"
            name="at"
            step="900"
            aria-label="Date and time"
            disabled
          />
        </fieldset>

        <fieldset class="filter-group">
          <legend class="filter-label">View</legend>
          <label class="pill"><input type="radio" name="view" value="list" />List</label>
          <label class="pill"><input type="radio" name="view" value="map" />Map</label>
        </fieldset>

        <fieldset class="filter-group">
          <legend class="filter-label">Sort</legend>
          <label class="pill"><input type="radio" name="sort" value="name" />A–Z</label>
          <label class="pill"><input type="radio" name="sort" value="opening" />Opening time</label>
          <label class="pill"><input type="radio" name="sort" value="closing" />Closing time</label>
          <label class="pill"><input type="radio" name="sort" value="distance" />Distance</label>
        </fieldset>

      </form>

      <p class="summary" id="summary" aria-live="polite"></p>
      <p class="notice" id="location-notice" role="status" hidden></p>

      <div id="list-view"></div>

      <section class="map-wrap" id="map-view" hidden>
        <div id="map" aria-label="Map of matching locations"></div>
        <p class="legend">
          <span><i class="dot dot-restaurant"></i>Restaurants &amp; cafés</span>
          <span><i class="dot dot-market"></i>Markets</span>
          <span><i class="dot dot-you"></i>You</span>
        </p>
        <p class="muted map-note" id="map-note"></p>
      </section>
    </main>
  </body>
</html>
